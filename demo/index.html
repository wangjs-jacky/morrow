<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Morrow · Obsidian 外观预览</title>
  <link rel="stylesheet" href="../plugin/styles.css">
  <style>
    body { margin: 0; background: #141821; color: #eef1f6; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    body.theme-light { background: #e9edf2; color: #263445; color-scheme: light; }
    body.theme-dark { color-scheme: dark; }
    .demo-mode { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; max-width: 1296px; margin: auto; padding: 14px 24px 0; font-size: 12px; }
    .demo-mode select { padding: 6px 10px; font: inherit; border-radius: 6px; }
    .demo-mode span { opacity: .8; }
  </style>
</head>
<body>
  <div class="demo-mode"><label for="demo-mode">预览配色</label> <select id="demo-mode"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select><span>Obsidian 中请使用「设置 → 外观 → 基础配色」切换</span></div>
  <div id="app"></div>
  <script src="./app.js"></script>
</body>
</html>
